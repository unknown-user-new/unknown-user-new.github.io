<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditing | My Site</title>
<style>
  :root { --bg-top:#34363a; --bg-bottom:#1f2023; --edge:#4a4d53; --text:#fff; --muted:#b9bcc2; }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; }
  body {
    background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom)) fixed;
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:48px 24px; gap:8px;
  }
  svg { width:min(340px, 80vw); height:auto; margin-bottom:16px; }
  svg .line { stroke:var(--text); fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
  svg .solid { fill:#2c2e32; stroke:var(--text); stroke-width:2.5; stroke-linejoin:round; }
  svg .glow { fill:#4b4f56; }
  h1 { margin:0; font-size:clamp(1.8rem,5vw,2.8rem); font-weight:600; }
  h2 { margin:0 0 20px; font-size:1.3rem; font-weight:400; color:var(--muted); }
  a { color:var(--text); text-decoration:none; padding:12px 28px; border:1px solid var(--edge); border-radius:999px; background:#2c2e32; transition:background .25s ease; }
  a:hover, a:focus-visible { background:#393c41; outline:none; }
  a:focus-visible { box-shadow:0 0 0 3px rgba(255,255,255,.6); }
</style>
</head>
<body>
  <svg viewBox="0 0 340 240" role="img" aria-label="A person sitting at a desk, staring at a computer monitor">
    <rect class="solid" x="95" y="20" width="150" height="100" rx="8"/>

    <path class="line" d="M170 120v22M145 142h50"/>
    <path class="line" d="M20 190h300"/>
    <path class="line" d="M45 190v34M295 190v34"/>
    <rect class="solid" x="120" y="176" width="100" height="14" rx="5"/>
    <circle class="solid" cx="170" cy="156" r="26"/>
    <path class="solid" d="M112 238c0-34 26-52 58-52s58 18 58 52z"/>
  </svg>
  <h1>Under Construction</h1>
  <h2>Auditing is coming soon.</h2>
  <a href="index.html">Back to home</a>
</body>
</html>
